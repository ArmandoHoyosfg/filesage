[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesage"
version = "0.1.0"
description = "Herramienta inteligente y modular para buscar, analizar, mover y eliminar archivos de forma segura (duplicados, espacio en disco, etc.)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FileSage Team"}
]
keywords = ["files", "duplicates", "disk-usage", "cleanup", "file-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
    "rich>=13.7",
    "xxhash>=3.4",
    "send2trash>=1.8",
    "pyyaml>=6.0",
    "PySide6>=6.6",
    # Metadatos (activas, no deprecadas, compatibles con MIT)
    "Pillow>=10.0",
    "pypdf>=4.0",
    "tinytag>=1.10",
    "puremagic>=1.26",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
filesage = "filesage.__main__:main"
filesage-gui = "filesage.presentation.gui.app:run_gui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
